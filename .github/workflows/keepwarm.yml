name: keep-gas-warm
# ปิง Google Apps Script web app เป็นระยะ ให้ instance อุ่นอยู่เสมอ
# → ลด cold start (เดิมรอบแรกช้า 20-60 วิ) ให้หน้าหลังบ้าน/การ์ดโหลดไว
# repo เป็น public → GitHub Actions ฟรีไม่จำกัดนาที

on:
  schedule:
    - cron: '*/5 * * * *'   # ทุก ~5 นาที (GitHub อาจหน่วงบ้างช่วงคิวแน่น)
  workflow_dispatch:        # กดรันเองได้จากแท็บ Actions

concurrency:
  group: keepwarm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping web app
        run: |
          URL="https://script.google.com/macros/s/AKfycbyGS50jFbBmz6nU-o6zPBGZrSokuyxD1TPQMhpfzwbpmzOJSg4emYaXKHv6QB_8Q9wAbg/exec?action=ping"
          # ปิง 2 ครั้ง: ครั้งแรกอาจเจอ cold start, ครั้งสองยืนยันว่าอุ่นแล้ว
          curl -sL -m 90 "$URL" -o /dev/null -w "ping#1 http=%{http_code} time=%{time_total}s\n" || true
          curl -sL -m 60 "$URL" -o /dev/null -w "ping#2 http=%{http_code} time=%{time_total}s\n" || true
